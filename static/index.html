<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>grok-bot-web</title>
  <style>
    :root {
      --bg: #0e1116;
      --panel: #161b22;
      --line: #2a3340;
      --text: #e8edf4;
      --muted: #8b97a8;
      --me: #1f3d2e;
      --bot: #1c2430;
      --accent: #7ee0a3;
      --accent-ink: #06210f;
      --danger: #ff8a80;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    body {
      display: flex;
      justify-content: center;
    }
    .app {
      width: min(42rem, 100%);
      height: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }
    header {
      padding: calc(0.85rem + env(safe-area-inset-top)) 1rem 0.85rem;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
    }
    header h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.8rem;
    }
    #status {
      color: var(--muted);
      font-size: 0.75rem;
    }
    #status.ok { color: var(--accent); }
    #status.err { color: var(--danger); }
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    .empty {
      margin: auto;
      color: var(--muted);
      text-align: center;
      max-width: 22rem;
    }
    .msg {
      max-width: 92%;
      padding: 0.7rem 0.85rem;
      border-radius: 0.9rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.me {
      align-self: flex-end;
      background: var(--me);
    }
    .msg.bot {
      align-self: flex-start;
      background: var(--bot);
      border: 1px solid var(--line);
    }
    .msg .who {
      display: block;
      font-size: 0.7rem;
      color: var(--muted);
      margin-bottom: 0.2rem;
    }
    form {
      display: flex;
      gap: 0.5rem;
      padding: 0.75rem 0.75rem calc(0.75rem + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: #12171e;
    }
    textarea {
      flex: 1;
      resize: none;
      min-height: 2.7rem;
      max-height: 8rem;
      padding: 0.65rem 0.75rem;
      border-radius: 0.75rem;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      font: inherit;
    }
    button {
      border: 0;
      border-radius: 0.75rem;
      padding: 0 1rem;
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 650;
      min-width: 4.5rem;
    }
    button:disabled {
      opacity: 0.45;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>grok-bot-web</h1>
        <p>Local drop-pipe chat. No xAI / Cursor API calls.</p>
      </div>
      <div id="status">checking…</div>
    </header>
    <div id="log">
      <div class="empty" id="empty">Send a message. A local Grok Bot / agent watcher should read the inbox and write a reply.</div>
    </div>
    <form id="form">
      <textarea id="text" rows="1" placeholder="Message…" autocomplete="off"></textarea>
      <button type="submit" id="send">Send</button>
    </form>
  </div>
  <script>
    const log = document.getElementById("log");
    const empty = document.getElementById("empty");
    const form = document.getElementById("form");
    const textEl = document.getElementById("text");
    const sendBtn = document.getElementById("send");
    const statusEl = document.getElementById("status");

    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.className = cls || "";
    }

    function addMsg(role, text) {
      if (empty) empty.remove();
      const el = document.createElement("div");
      el.className = "msg " + role;
      const who = document.createElement("span");
      who.className = "who";
      who.textContent = role === "me" ? "you" : "bot";
      el.appendChild(who);
      el.appendChild(document.createTextNode(text));
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
    }

    async function health() {
      try {
        const r = await fetch("/api/health");
        if (!r.ok) throw new Error("health " + r.status);
        setStatus("online", "ok");
      } catch {
        setStatus("offline", "err");
      }
    }

    async function pollReply(id) {
      const started = Date.now();
      while (Date.now() - started < 120000) {
        const r = await fetch("/api/reply?id=" + encodeURIComponent(id));
        if (r.status === 200) return r.json();
        if (r.status !== 204) throw new Error("reply " + r.status);
        await new Promise((res) => setTimeout(res, 500));
      }
      throw new Error("timed out waiting for reply");
    }

    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const text = textEl.value.trim();
      if (!text) return;
      sendBtn.disabled = true;
      addMsg("me", text);
      textEl.value = "";
      try {
        const r = await fetch("/api/send", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || "send failed");
        setStatus("waiting…", "");
        const reply = await pollReply(data.id);
        addMsg("bot", reply.text || "");
        setStatus("online", "ok");
      } catch (err) {
        addMsg("bot", String(err.message || err));
        setStatus("error", "err");
      } finally {
        sendBtn.disabled = false;
        textEl.focus();
      }
    });

    textEl.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" && !ev.shiftKey) {
        ev.preventDefault();
        form.requestSubmit();
      }
    });

    health();
    setInterval(health, 15000);
    textEl.focus();
  </script>
</body>
</html>
